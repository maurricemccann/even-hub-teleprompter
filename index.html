<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teleprompter</title>
  </head>
  <body>
    <div id="app">
      <main>
        <h1>Teleprompter</h1>
        <p class="hint">Paste your script, press Send. Swipe down on the glasses to advance, swipe up to go back.</p>
        <div class="modes">
          <button id="mode-scroll" type="button" class="mode-btn active">Scroll</button>
          <button id="mode-flashcard" type="button" class="mode-btn">Flashcard</button>
        </div>
        <div class="presets">
          <button id="preset-truths" type="button">Load Truths</button>
          <button id="preset-seed" type="button">Load Seed Speech</button>
        </div>
        <textarea id="script" rows="10" placeholder="Paste your script here..."></textarea>
        <button id="send" type="button">Send to glasses</button>
        <p id="status"></p>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
